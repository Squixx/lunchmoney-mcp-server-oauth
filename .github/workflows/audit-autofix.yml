name: Audit autofix

# Fixes `pnpm audit` findings on main without a human in the loop: pins the
# patched version of each vulnerable package with a pnpm override, bumps the
# patch version (so a new image tag ships), and opens a PR with auto-merge
# enabled. That PR runs the full image.yml gate (frozen install, sanitizer
# tests, OAuth + MCP smoke test, audit, multi-arch build) and only merges
# once all required checks are green.
#
# The repo's "Allow auto-merge" setting is not something this workflow can
# rely on (it was off once and every run failed). When GitHub refuses
# auto-merge, the "Merge when green" step merges the PR itself, and only
# after image.yml's `audit` and `build` passed on the PR's exact head commit.
# It runs on every schedule and again whenever image.yml finishes on the
# autofix branch, so the PR merges minutes after CI goes green.

on:
  schedule:
    - cron: '23 */6 * * *'  # every 6 hours — new advisories land at any time
  workflow_dispatch:
  workflow_run:
    workflows: ['Build & publish image']
    types: [completed]
    branches: [autofix/audit]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  BRANCH: autofix/audit

jobs:
  autofix:
    # The token lives in the `autofix` environment, whose deployment-branch
    # rule allows only main. A PR branch that edits this file to reach the
    # secret is refused by GitHub before the job starts.
    if: github.ref == 'refs/heads/main'
    environment: autofix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A workflow_run wake only needs the merge step below, which uses
      # the API and runs no repository code.
      - name: Checkout
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # tags, to tell whether the current version is already released
          persist-credentials: false

      - name: Setup Node
        if: github.event_name != 'workflow_run'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'

      - name: Enable Corepack
        if: github.event_name != 'workflow_run'
        env:
          COREPACK_ENABLE_STRICT: '1'
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
          # Node 25+ no longer bundles Corepack; keep in sync with the Dockerfile.
          # renovate: datasource=npm depName=corepack
          COREPACK_VERSION: '0.36.0'
        run: |
          npm install -g --ignore-scripts "corepack@${COREPACK_VERSION}"
          corepack enable
          corepack install

      - name: Audit
        id: audit
        if: github.event_name != 'workflow_run'
        run: |
          set -euo pipefail
          if pnpm audit --prod --audit-level=moderate; then
            echo "vulnerable=false" >> "$GITHUB_OUTPUT"
          else
            echo "vulnerable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pin patched versions
        id: fix
        if: steps.audit.outputs.vulnerable == 'true'
        run: |
          set -euo pipefail
          { pnpm audit --prod --json || true; } | node -e '
            const r = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const keep = new Set(["moderate", "high", "critical"]);
            for (const a of Object.values(r.advisories ?? {}))
              if (keep.has(a.severity))
                console.log(`- **${a.severity}** \`${a.module_name}\` ${a.vulnerable_versions} → ${a.patched_versions}: [${a.github_advisory_id}](${a.url}) ${a.title}`);
          ' > "$RUNNER_TEMP/advisories.md"
          cat "$RUNNER_TEMP/advisories.md"

          # "override" pins only the vulnerable packages; "update" would
          # re-resolve the whole lockfile, which is too broad to automerge.
          pnpm audit --prod --audit-level=moderate --fix override
          # pnpm's minimumReleaseAge (24 h) can refuse a patch that was only
          # just published. Not an error: the next scheduled run retries.
          if ! pnpm install --prod --no-frozen-lockfile; then
            echo "::warning::lockfile refresh failed (patched release likely younger than pnpm's minimumReleaseAge) — retrying next run"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! pnpm audit --prod --audit-level=moderate; then
            echo "::error::advisories remain after --fix (no patched version, or blocked by an override range) — needs a human"
            exit 1
          fi

          # Same rule as image.yml's version-bump guard: image contents
          # changed, so ship under a version that is not yet released.
          version=$(node -p "require('./package.json').version")
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            node -e '
              const fs = require("fs");
              const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
              const [ma, mi, pa] = p.version.split(".").map(Number);
              p.version = `${ma}.${mi}.${pa + 1}`;
              fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
            '
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Open automerging PR
        if: steps.fix.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
          VERSION: ${{ steps.fix.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::AUTOFIX_TOKEN is not set in the autofix environment"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add package.json pnpm-lock.yaml pnpm-workspace.yaml
          git commit -m "Fix audit findings (v$VERSION)" -m "$(cat "$RUNNER_TEMP/advisories.md")"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Skip the push when the open branch already carries this exact
          # fix on top of current main: a fresh commit would restart CI and
          # the PR could never go green between two scheduled runs.
          git fetch -q "$remote" "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null || true
          if git rev-parse -q --verify "refs/remotes/origin/$BRANCH" >/dev/null \
            && [ "$(git rev-parse "origin/$BRANCH^{tree}")" = "$(git rev-parse "HEAD^{tree}")" ] \
            && [ "$(git rev-parse "origin/$BRANCH^")" = "$(git rev-parse HEAD^)" ]; then
            echo "$BRANCH already carries this fix on current main — not re-pushing"
          else
            # Pushed with the PAT, not GITHUB_TOKEN: pushes made with
            # GITHUB_TOKEN do not trigger workflows, so CI would never run on
            # the PR and it could never merge. The branch is rebuilt from
            # main whenever main or the fix changes, so a force push is
            # expected.
            git push --force "$remote" "HEAD:refs/heads/$BRANCH"
          fi

          body=$(printf '%s\n\n%s\n\n%s\n' \
            "Automated fix for \`pnpm audit\` findings on \`main\`:" \
            "$(cat "$RUNNER_TEMP/advisories.md")" \
            "Each vulnerable package is pinned to its patched release with a pnpm override in \`pnpm-workspace.yaml\`, and the version is bumped to \`$VERSION\` so a new image tag is published. This merges once \`audit\` and \`build\` pass: through auto-merge when the repo allows it, otherwise the next audit-autofix run merges it.")
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "Fix audit findings (v$VERSION)" --body "$body"
            number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')
          else
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "Fix audit findings (v$VERSION)" --body "$body"
          fi

          # The GraphQL mutation, not `gh pr merge --auto`: gh falls back to
          # merging immediately when nothing is pending, which would skip CI
          # if branch protection were ever removed. The mutation refuses
          # instead, so this PR can only merge through required checks.
          # Refused when "Allow auto-merge" is off; "Merge when green" below
          # covers that case.
          id=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json id --jq .id)
          if ! gh api graphql -f id="$id" -f query='
            mutation($id: ID!) {
              enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) {
                pullRequest { number autoMergeRequest { enabledAt } }
              }
            }'; then
            echo "::notice::auto-merge unavailable for #$number — it is merged by this workflow once audit and build pass"
          fi

      - name: Merge when green
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::AUTOFIX_TOKEN is not set in the autofix environment"
            exit 1
          fi
          # Same-repo PRs only: a fork can name its branch autofix/audit too.
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open \
            --json number,headRefOid,isCrossRepository,autoMergeRequest \
            --jq '[.[] | select(.isCrossRepository | not)][0] // empty')
          if [ -z "$pr" ]; then
            echo "no open $BRANCH PR — nothing to merge"
            exit 0
          fi
          number=$(jq -r .number <<<"$pr")
          sha=$(jq -r .headRefOid <<<"$pr")
          if [ "$(jq -r '.autoMergeRequest != null' <<<"$pr")" = true ]; then
            echo "#$number has auto-merge enabled — GitHub merges it when checks pass"
            exit 0
          fi

          # image.yml's jobs on the exact head commit. GitHub Actions runs
          # only, so another app cannot satisfy the gate with a same-named
          # check; the API returns the latest attempt of each.
          conclusion() {
            gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.app.slug == \"github-actions\" and .name == \"$1\")][0] | if . == null then \"missing\" elif .status != \"completed\" then \"pending\" else .conclusion end"
          }
          audit=$(conclusion audit)
          build=$(conclusion build)
          echo "#$number @ ${sha:0:7}: audit=$audit build=$build"
          if [ "$audit" = success ] && [ "$build" = success ]; then
            # --match-head-commit: refuse if the branch moved after the
            # checks above were read.
            gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$sha"
          elif [ "$audit" = failure ] || [ "$build" = failure ]; then
            echo "::error::CI failed on autofix PR #$number — needs a human"
            exit 1
          else
            echo "checks not finished on #$number — the next run merges it"
          fi

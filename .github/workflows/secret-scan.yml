name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    # Betterleaks (the Gitleaks successor) over the full git history, with its
    # built-in rules. Findings already in history are fingerprinted in
    # .betterleaksignore; anything else fails. Validation of found secrets
    # against live APIs is off (the default), so nothing leaves the runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Release binary, verified against the pinned checksum. Renovate opens
      # the version bump; copy the linux_x64 line of that release's
      # checksums.txt into BETTERLEAKS_SHA256 in the same PR.
      BETTERLEAKS_VERSION: "1.10.1"
      BETTERLEAKS_SHA256: "c174b42d7aa60caf58c0c3e555c0e4bed01fe6b0d99a412bce777b5af4ce913e"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download betterleaks
        run: |
          set -euo pipefail
          archive="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/${archive}"
          echo "${BETTERLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" betterleaks

      - name: Scan full git history
        run: |
          "$RUNNER_TEMP/betterleaks" git --redact --verbose --no-banner .
